name: Poll QLD power outages

on:
  workflow_dispatch:
  push:
    paths:
      - 'qld_power_outage_pipeline.py'
      - 'provider_councils.py'
      - 'provider_snapshot_cache.py'
      - 'write_provider_health.py'
      - 'write_provider_council_counts.py'
      - 'publish_outage_data.py'
      - '.github/workflows/poll-outages.yml'

permissions:
  contents: write

concurrency:
  group: qld-power-outage-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update branch before generating data
        run: |
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run outage pipeline
        run: |
          python qld_power_outage_pipeline.py --output-dir data --debug

      - name: Write provider council counts
        run: python write_provider_council_counts.py

      - name: Write provider health history
        run: |
          python write_provider_health.py

      - name: Commit updated data
        id: publish
        run: python -u publish_outage_data.py

      - name: Preserve snapshot if publication fails
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: outage-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/*.csv
            data/*.geojson
            data/*.json
          retention-days: 3
          if-no-files-found: error

      - name: Fail if provider feed failed
        run: |
          python fail_if_provider_failed.py

