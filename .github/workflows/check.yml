name: Check council count collection
on:
  push:
    paths:
      - 'write_provider_council_counts.py'
      - 'provider_councils.py'
      - 'provider_snapshot_cache.py'
      - 'check_provider_collection.py'
      - 'write_provider_health.py'
      - 'qld_power_outage_pipeline.py'
      - 'index.html'
      - 'fail_if_provider_failed.py'
      - 'tests/**'
      - '.github/workflows/*.yml'
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source transport dependencies
        run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard aggregation
        run: node tests/dashboard.test.cjs
      - name: Verify live council sources from the hosted runner
        run: python -u check_provider_collection.py --rounds 3
